<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burmalda Mess // secure messenger</title>
    <style>
        :root {
            --bg-main: #0f0f12;
            --bg-panel: #16161a;
            --bg-chat: #1a1a22;
            --bg-msg-in: #22222c;
            --bg-msg-out: #2a3a5a;
            --text-main: #e2e2e9;
            --text-muted: #888899;
            --accent: #5a7af0;
            --accent-hover: #4a6ae0;
            --danger: #ff4a4a;
            --success: #4aff4a;
            --border: #262630;
        }

        body.light-theme {
            --bg-main: #f0f2f5;
            --bg-panel: #ffffff;
            --bg-chat: #f9fbfd;
            --bg-msg-in: #e4e6eb;
            --bg-msg-out: #bbdefb;
            --text-main: #1c1e21;
            --text-muted: #65676b;
            --accent: #1877f2;
            --accent-hover: #166fe5;
            --danger: #fa3e3e;
            --success: #2ebd4f;
            --border: #ccd0d5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        /* Окна авторизации */
        .auth-container { background-color: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .auth-header { text-align: center; margin-bottom: 24px; }
        .auth-header h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
        .auth-header p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
        .form-group { margin-bottom: 16px; position: relative; }
        .form-group input { width: 100%; padding: 12px 14px; background-color: var(--bg-main); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 15px; outline: none; transition: border 0.2s; }
        .form-group input:focus { border-color: var(--accent); }
        .btn { width: 100%; padding: 12px; background-color: var(--accent); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background-color: var(--accent-hover); }
        .auth-toggle { text-align: center; margin-top: 16px; font-size: 14px; color: var(--text-muted); cursor: pointer; }
        .auth-toggle:hover { color: var(--accent); }

        /* Главный интерфейс приложения */
        #app-container { display: none; width: 100vw; height: 100vh; }
        .messenger-layout { display: flex; width: 100%; height: 100%; }

        /* Боковая панель */
        .sidebar { width: 320px; background-color: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header h2 { font-size: 18px; font-weight: 700; }
        .list-section { flex: 1; overflow-y: auto; padding: 12px; }
        .section-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin: 16px 0 8px 4px; display: flex; justify-content: space-between; align-items: center; }
        .add-btn { cursor: pointer; color: var(--accent); font-size: 18px; font-weight: bold; }
        .list-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; transition: background 0.2s; }
        .list-item:hover { background-color: var(--bg-main); }
        .list-item.active { background-color: var(--accent); color: white; }
        .item-muted { font-size: 12px; color: var(--text-muted); }

        /* Основная зона чата */
        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-chat); }
        .chat-header { height: 60px; padding: 0 20px; background-color: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

        /* Стили сообщений */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 65%; width: fit-content; margin-bottom: 4px; }
        .msg-wrapper.incoming { align-self: flex-start; }
        .msg-wrapper.outgoing { align-self: flex-end; }
        .msg-bubble { padding: 10px 14px; border-radius: 12px; position: relative; word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .incoming .msg-bubble { background-color: var(--bg-msg-in); border-bottom-left-radius: 4px; }
        .outgoing .msg-bubble { background-color: var(--bg-msg-out); border-bottom-right-radius: 4px; }
        .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; color: var(--text-muted); }
        .msg-sender { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
        .outgoing .msg-sender { display: none; }

        /* Системные сообщения */
        .system-msg { align-self: center; background-color: var(--bg-panel); border: 1px solid var(--border); padding: 4px 12px; border-radius: 20px; font-size: 12px; color: var(--text-muted); margin: 8px 0; }

        /* Панель ввода */
        .chat-input-panel { padding: 16px 20px; background-color: var(--bg-panel); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .chat-input-panel input { flex: 1; padding: 12px 16px; background-color: var(--bg-main); border: 1px solid var(--border); border-radius: 24px; color: var(--text-main); font-size: 15px; outline: none; }
        .chat-input-panel input:focus { border-color: var(--accent); }
        .send-btn { background-color: var(--accent); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: background 0.2s; }
        .send-btn:hover { background-color: var(--accent-hover); }

        /* Вспомогательные элементы */
        .online-badge { width: 8px; height: 8px; background-color: var(--success); border-radius: 50%; display: inline-block; margin-left: 6px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ОКНО ВХОДА -->
    <div id="login-window" class="auth-container">
        <div class="auth-header">
            <h1>⚡ Burmalda Mess</h1>
            <p>// secure messenger</p>
        </div>
        <form id="login-form" onsubmit="handleAuth(event, '/login')">
            <div class="form-group">
                <input type="text" name="username" placeholder="Имя пользователя" required autocomplete="username">
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Пароль" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">Войти</button>
        </form>
        <div class="auth-toggle" onclick="toggleAuthWindows(true)">Ещё нет аккаунта? Зарегистрировать</div>
    </div>

    <!-- ОКНО РЕГИСТРАЦИИ -->
    <div id="register-window" class="auth-container hidden">
        <div class="auth-header">
            <h1>Создать аккаунт</h1>
            <p>Присоединяйтесь к Burmalda Mess</p>
        </div>
        <form id="register-form" onsubmit="handleAuth(event, '/register')">
            <div class="form-group">
                <input type="text" name="username" placeholder="Придумайте никнейм" required autocomplete="username">
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Придумайте пароль (мин. 8 символов)" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn">Создать аккаунт</button>
        </form>
        <div class="auth-toggle" onclick="toggleAuthWindows(false)">Уже есть аккаунт? Войти</div>
    </div>

    <!-- ГЛАВНЫЙ ИНТЕРФЕЙС МЕССЕНДЖЕРА -->
    <div id="app-container">
        <div class="messenger-layout">

            <!-- БОКОВАЯ ПАНЕЛЬ -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h2 id="my-name-display">⚡ Burmalda Mess</h2>
                    <span style="cursor:pointer;" onclick="toggleTheme()">🌙</span>
                </div>

                <div class="list-section">
                    <div class="section-title">
                        <span>Комнаты</span>
                        <span class="add-btn" onclick="createNewRoom()">＋</span>
                    </div>
                    <div id="rooms-list-container">
                        <!-- Сюда динамически рендерятся комнаты -->
                    </div>

                    <div class="section-title">
                        <span>Личные сообщения</span>
                    </div>
                    <div id="dms-list-container">
                        <!-- Сюда динамически рендерятся приватные диалоги -->
                    </div>
                </div>
            </div>

            <!-- ЗОНА ЧАТА -->
            <div class="chat-area">
                <div class="chat-header">
                    <div>
                        <span id="current-chat-title" style="font-weight:700; font-size:16px;">Выберите чат</span>
                        <span id="current-chat-status"></span>
                    </div>
                </div>

                <!-- Контейнер для сообщений чата -->
                <div class="chat-messages" id="chat-messages-box">
                    <div class="system-msg">Добро пожаловать! Выберите комнату или напишите кому-нибудь из списка пользователей.</div>
                </div>

                <!-- Панель ввода сообщения -->
                <div class="chat-input-panel">
                    <input type="text" id="message-text-input" placeholder="Написать сообщение..." autocomplete="off" onkeydown="handleInputFieldKeyPress(event)">
                    <button class="send-btn" onclick="sendMessageToServer()" title="Отправить">➤</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let ws = null;
        let currentUsername = "";
        let currentRoomId = "general";
        let isLight = false;

        function toggleAuthWindows(showRegister) {
            document.getElementById("login-window").classList.toggle("hidden", showRegister);
            document.getElementById("register-window").classList.toggle("hidden", !showRegister);
        }

        function toggleTheme() {
            isLight = !isLight;
            document.body.classList.toggle("light-theme", isLight);
        }

        async function handleAuth(event, endpoint) {
            event.preventDefault();
            const form = event.target;
            // Собираем данные формы
            const urlEncoded = new URLSearchParams();
            for (const pair of new FormData(form)) {
                urlEncoded.append(pair[0], pair[1]);
            }
            try {
                // Отправляем запрос в формате application/x-www-form-urlencoded для FastAPI Form(...)
                const response = await fetch(endpoint, {
                    method: "POST",
                    body: urlEncoded,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();
                if (result.error) {
                    alert(result.error);
                } else if (result.ok) {
                    if (endpoint === "/register") {
                        alert("Регистрация успешна! Теперь вы можете войти.");
                        toggleAuthWindows(false);
                    } else if (endpoint === "/login") {
                        currentUsername = result.username;
                        initializeMessengerSession();
                    }
                }
            } catch (err) {
                alert("Ошибка соединения с сервером деплоя.");
            }
        }

        function initializeMessengerSession() {
            document.getElementById("login-window").classList.add("hidden");
            document.getElementById("register-window").classList.add("hidden");
            document.getElementById("app-container").style.display = "block";
            document.getElementById("my-name-display").innerText = `👤 ${currentUsername}`;
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/${currentUsername}`);
            ws.onmessage = function(event) {
                const packet = jsonParseSafe(event.data);
                if (!packet) return;
                switch(packet.type) {
                    case "init":
                        renderSidebarElements(packet.rooms || [], packet.online_users || []);
                        if (packet.last_room) {
                            switchActiveChatRoom(packet.last_room, packet.last_room);
                        } else {
                            switchActiveChatRoom("general", "Общий чат");
                        }
                        break;
                    case "online_update":
                        updateUsersOnlineList(packet.online_users || []);
                        break;
                    case "room_joined":
                        if (packet.name && !String(packet.name).startsWith("dm_")) {
                            document.getElementById("current-chat-title").innerText = packet.name;
                        }
                        document.getElementById("chat-messages-box").innerHTML = "";
                        break;
                    case "history":
                        if (packet.data) {
                            appendMessageToBox(packet.data, true);
                        }
                        break;
                    case "message":
                        if (packet.data && packet.data.room_id === currentRoomId) {
                            appendMessageToBox(packet.data, false);
                        }
                        break;
                    case "system":
                        appendSystemNotification(packet.text);
                        break;
                    case "room_created":
                        addRoomToSidebarList(packet.room_id, packet.name);
                        break;
        }
    };
        ws.onclose = function() {
            appendSystemNotification("🔴 Соединение разорвано. Переподключение через 5 секунд...");
            setTimeout(initializeMessengerSession, 5000);
        };


function appendMessageToBox(msg, isHistory) {
    const box = document.getElementById("chat-messages-box");
    if (!msg) return;

    const isOutgoing = msg.sender === currentUsername;
    const wrapper = document.createElement("div");
    wrapper.className = `msg-wrapper ${isOutgoing ? 'outgoing' : 'incoming'}`;
    
    // Принудительно задаем правильные стили контейнера
    wrapper.style.width = "100%";
    wrapper.style.display = "flex";
    wrapper.style.flexDirection = "column";
    wrapper.style.alignItems = isOutgoing ? "flex-end" : "flex-start";

    const rawTimestamp = msg.timestamp || msg.time;
    let displayTime = "00:00";
    
    if (rawTimestamp) {
        let cleanTimestamp = rawTimestamp;
        if (cleanTimestamp.includes('.')) {
            cleanTimestamp = cleanTimestamp.split('.') + 'Z';
        }
        const dateObj = new Date(cleanTimestamp);
        if (!isNaN(dateObj.getTime())) {
            displayTime = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } else {
            displayTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
    } else {
        displayTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    wrapper.innerHTML = `
        <div class="msg-bubble" style="max-width: 65%; min-width: 120px;">
            <div class="msg-sender" style="display: block !important; margin-bottom: 4px;">${msg.sender}</div>
            <div class="msg-text" style="font-size: 15px; line-height: 1.4;">${escapeHtml(msg.text)}</div>
            <div class="msg-meta">
                <span>${displayTime}</span>
            </div>
        </div>
    `;
    
    box.appendChild(wrapper);
    box.scrollTop = box.scrollHeight;
}

        function appendSystemNotification(text) {
            const box = document.getElementById("chat-messages-box");
            const div = document.createElement("div");
            div.className = "system-msg";
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function sendMessageToServer() {
            const input = document.getElementById("message-text-input");
            const text = input.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ type: "text", text: text }));
            input.value = "";
        }

        function handleInputFieldKeyPress(event) {
            if (event.key === "Enter") {
                sendMessageToServer();
            }
        }

        function switchActiveChatRoom(roomId, roomName) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            currentRoomId = roomId;
            ws.send(JSON.stringify({ type: "join_room", room_id: roomId }));
            document.querySelectorAll(".list-item").forEach(el => el.classList.remove("active"));
            const activeEl = document.getElementById(`item-${roomId}`);
            if (activeEl) activeEl.classList.add("active");
            document.getElementById("current-chat-title").innerText = roomName || roomId;
        }

        function createNewRoom() {
            const name = prompt("Введите название новой комнаты:");
            if (!name || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ type: "create_room", name: name }));
        }

        function renderSidebarElements(roomsList, onlineUsers) {
            const roomsBox = document.getElementById("rooms-list-container");
            roomsBox.innerHTML = `<div id="item-general" class="list-item active" onclick="switchActiveChatRoom('general', 'Общий чат')"><span># Общий чат</span></div>`;
            (roomsList || []).forEach(r => {
                if (r.id !== "general") addRoomToSidebarList(r.id, r.name);
            });
            updateUsersOnlineList(onlineUsers || []);
        }

        function addRoomToSidebarList(id, name) {
            const roomsBox = document.getElementById("rooms-list-container");
            if (document.getElementById(`item-${id}`)) return;
            const div = document.createElement("div");
            div.id = `item-${id}`;
            div.className = "list-item";
            div.onclick = () => switchActiveChatRoom(id, name);
            div.innerHTML = `<span># ${escapeHtml(name)}</span>`;
            roomsBox.appendChild(div);
        }

        function updateUsersOnlineList(users) {
            const dmsBox = document.getElementById("dms-list-container");
            dmsBox.innerHTML = "";
            (users || []).forEach(user => {
                if (user === currentUsername) return;
                const dmRoomId = currentUsername < user ? `dm_${currentUsername}_${user}` : `dm_${user}_${currentUsername}`;
                const div = document.createElement("div");
                div.id = `item-${dmRoomId}`;
                div.className = "list-item";
                div.onclick = () => switchActiveChatRoom(dmRoomId, user);
                div.innerHTML = `<span>👤 ${escapeHtml(user)}</span> <span class="online-badge"></span>`;
                dmsBox.appendChild(div);
            });
        }

        function jsonParseSafe(data) {
            try { return JSON.parse(data); }
            catch(e) { return null; }
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }
    </script>
</body>
</html>
